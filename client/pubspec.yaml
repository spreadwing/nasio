name: nasio_client
description: "Nasio 绿联 NAS 智能中枢与资产管家跨平台管理控制台 (Flutter)"
publish_to: 'none'
version: 1.0.2+35

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  provider: ^6.1.5+1
  
  # 网络请求与 WebSocket
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  
  # 本地持久化
  shared_preferences: ^2.5.6
  
  # 格式化与工具
  intl: ^0.20.3
  uuid: ^4.6.0
  
  # 图标与 UI 增强
  cupertino_icons: ^2.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 700

