<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="diag" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E35B1"/>
      <stop offset="100%" stop-color="#B388FF"/>
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#131320" stroke="#212138" stroke-width="4"/>

  <!-- Left NAS Pillar (Base Storage) -->
  <rect x="120" y="140" width="64" height="232" rx="32" fill="#283593"/>
  <circle cx="152" cy="180" r="10" fill="#EA80FC"/>
  <circle cx="152" cy="220" r="6" fill="#7C4DFF"/>

  <!-- Center Diagonal Flight Wing / Bridge -->
  <path d="M 152 172 L 360 340" stroke="url(#diag)" stroke-width="64" stroke-linecap="round"/>

  <!-- Right Pillar (Copilot Uplink) -->
  <rect x="328" y="140" width="64" height="232" rx="32" fill="#651FFF"/>
  <circle cx="360" cy="332" r="10" fill="#FFFFFF"/>
</svg>