<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <filter id="cubeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg3)" stroke="#232B3A" stroke-width="4"/>

  <!-- Isometric Server Cube Group -->
  <g filter="url(#cubeShadow)">
    <!-- Top Face (Light Sky) -->
    <polygon points="256,150 376,218 256,286 136,218" fill="#4FC3F7"/>

    <!-- Left Face (Primary Blue) -->
    <polygon points="136,218 256,286 256,400 136,332" fill="#0288D1"/>
    <!-- Slot 1 on Left Face -->
    <line x1="166" y1="275" x2="226" y2="309" stroke="#01579B" stroke-width="8" stroke-linecap="round"/>
    <circle cx="166" cy="275" r="5" fill="#00E5FF"/>

    <!-- Right Face (Deep Navy) -->
    <polygon points="256,286 376,218 376,332 256,400" fill="#004C74"/>
    <!-- Slot 2 on Right Face -->
    <line x1="286" y1="309" x2="346" y2="275" stroke="#002D45" stroke-width="8" stroke-linecap="round"/>
    <circle cx="346" cy="275" r="5" fill="#80D8FF"/>
  </g>

  <!-- Floating Material AI Spark above cube -->
  <path d="M 256 96 C 256 122 268 136 294 140 C 268 144 256 158 256 184 C 256 158 244 144 218 140 C 244 136 256 122 256 96 Z" 
        fill="#00E5FF"/>
  <circle cx="256" cy="140" r="4" fill="#FFFFFF"/>
</svg>