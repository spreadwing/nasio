<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="bay1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#03A9F4"/>
    </linearGradient>
    <linearGradient id="bay2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004C74"/>
      <stop offset="100%" stop-color="#003554"/>
    </linearGradient>
    <filter id="glow1" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00E5FF" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg1)" stroke="#232B3A" stroke-width="4"/>
  
  <!-- Lower Bay (Container) -->
  <rect x="100" y="260" width="312" height="112" rx="28" fill="url(#bay2)"/>
  <circle cx="150" cy="316" r="10" fill="#00E5FF"/>
  <circle cx="180" cy="316" r="6" fill="#0288D1"/>
  <rect x="214" y="311" width="160" height="10" rx="5" fill="#071E2D"/>

  <!-- Upper Bay (Active Node) -->
  <rect x="100" y="140" width="220" height="100" rx="28" fill="url(#bay1)"/>
  <circle cx="150" cy="190" r="10" fill="#FFFFFF"/>
  <circle cx="180" cy="190" r="6" fill="#B3E5FC"/>
  <rect x="214" y="185" width="76" height="10" rx="5" fill="#01579B"/>

  <!-- AI Copilot Spark -->
  <path d="M 376 136 C 376 168 390 186 422 190 C 390 194 376 212 376 244 C 376 212 362 194 330 190 C 362 186 376 168 376 136 Z" 
        fill="#00E5FF" filter="url(#glow1)"/>
  <circle cx="376" cy="190" r="5" fill="#FFFFFF"/>
</svg>