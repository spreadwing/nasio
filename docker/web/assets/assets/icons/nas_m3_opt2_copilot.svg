<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glowSpark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00E5FF" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg2)" stroke="#232B3A" stroke-width="4"/>

  <!-- Left NAS Pillar (Base Storage) -->
  <rect x="116" y="140" width="64" height="232" rx="32" fill="#004C74"/>
  <circle cx="148" cy="180" r="10" fill="#00E5FF"/>
  <circle cx="148" cy="220" r="6" fill="#0288D1"/>

  <!-- Center Diagonal Flight Wing / Bridge (Forms standard letter N) -->
  <path d="M 148 172 L 364 340" stroke="url(#diagGrad)" stroke-width="64" stroke-linecap="round"/>

  <!-- Right Pillar (Copilot Uplink) -->
  <rect x="332" y="140" width="64" height="232" rx="32" fill="#0288D1"/>
  <circle cx="364" cy="332" r="10" fill="#FFFFFF"/>

  <!-- Top Right AI Copilot Spark -->
  <path d="M 364 88 C 364 112 374 124 398 128 C 374 132 364 144 364 168 C 364 144 354 132 330 128 C 354 124 364 112 364 88 Z" 
        fill="#00E5FF" filter="url(#glowSpark)"/>
  <circle cx="364" cy="128" r="4" fill="#FFFFFF"/>
</svg>